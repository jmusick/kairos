name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CurseForge token
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [[ -z "$CF_API_KEY" ]]; then
            echo "::error::Add the CURSEFORGE_API_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
